name: 📈 Intraday Price Update

on:
  # TradingView 資料延遲 15 分鐘，故每小時 :16 分執行 + 收盤後 14:01 抓最終收盤價
  # 台灣 9:16/10:16/11:16/12:16/13:16 = UTC 1:16/2:16/3:16/4:16/5:16
  # 台灣 14:01 = UTC 6:01
  schedule:
    - cron: '16 1-5 * * 1-5'
    - cron: '1 6 * * 1-5'
  
  # 手動觸發按鈕 (方便測試)
  workflow_dispatch:

# 給予 GitHub Bot 推送權限
permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest # 使用免費 Linux 虛擬機

    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 3.10 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install pandas git+https://github.com/rongardF/tvdatafeed.git

      - name: 📈 執行盤中股價更新
        run: |
          python price_downloader/update_intraday.py

      - name: 💾 推送更新後的股價資料
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 加入更新過的 CSV 與時間戳
          git add price_downloader/hist_prices/
          git add price_downloader/last_price_update.txt || true
          
          # 如果沒有變動 (假日) 就跳過 commit
          git commit -m "📈 Intraday price update [skip ci]" || echo "今日無股價更新 (可能為假日)"
          git push
