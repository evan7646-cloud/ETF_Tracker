name: ETF Daily Crawler 🚀

on:
  # 設定排程時間 (GitHub 伺服器是 UTC 時間，台灣時間需減 8 小時)
  # 這裡的 '30 10 * * *' 代表每天 UTC 10:30 執行 = 台灣時間 18:30 執行
  schedule:
    - cron: '30 10 * * *'
  
  # 加上這個設定，讓您可以在 GitHub 網頁上手動點擊按鈕來測試執行
  workflow_dispatch:

# 給予 GitHub Bot 推送程式碼 (覆蓋資料庫) 的權限
permissions:
  contents: write

jobs:
  run-crawler-and-save:
    runs-on: ubuntu-latest # 使用免費的 Linux 虛擬機

    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 3.10 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安裝爬蟲所需套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🕷️ 執行 ETF 爬蟲 (抓取最新持股)
        run: |
          python crawler.py

      - name: 💾 將更新後的資料庫 (DB) 推送回 GitHub
        run: |
          # 設定虛擬機器人的 Git 身份
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 將有變動的資料庫加入追蹤
          git add etf_holdings.db
          
          # 檢查是否有更新，如果有就 Commit 並 Push
          # [skip ci] 標籤是為了防止 Push 後又引發無限迴圈觸發 Action
          git commit -m "🤖 Auto-update ETF holdings db [skip ci]" || echo "今日無資料更新"
          git push